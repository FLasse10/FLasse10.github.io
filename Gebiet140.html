<!doctype html>
            <html lang="de">
            <head>
                <meta charset="utf-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1" />
                <title>Karte mit Polygon – GitHub Pages</title>

                <!-- Leaflet CSS (ohne integrity) -->
                <link
                    rel="stylesheet"
                    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
                />

                <style>
                    html, body {
                        height: 100%;
                        margin: 0;
                    }
                    #map {
                        height: 100%;
                        width: 100%;
                    }
                </style>
            </head>
            <body>

            <div id="map"></div>

            <!-- Leaflet JS (ohne integrity) -->
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            <script>
                const map = L.map('map').setView([8.89,51.97], 13);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap Mitwirkende'
                }).addTo(map);

                const polygonCoordinates = [[51.985243838194386, 8.904697895050049], [52.00046494990789, 8.881008625030518], [52.011877388269085, 8.89542818069458], [52.00405806845209, 8.907101154327393], [52.014413090481604, 8.929073810577393], [52.00194450423989, 8.94212007522583], [51.985243838194386, 8.904697895050049]];

                const polygon = L.polygon(polygonCoordinates, {
                    color: 'red',
                    fillColor: 'orange',
                    fillOpacity: 0.5
                }).addTo(map);

                polygon.bindPopup("Mein Polygon auf GitHub Pages");

                map.fitBounds(polygon.getBounds());
            </script>

            </body>
            </html>
